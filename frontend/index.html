<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Build and share your professional developer portfolio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MERN Portfolio Builder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Empower theme config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'night-sky':    '#151515',
              'void-black':   '#0e0e0e',
              'ember-surface':'#242424',
              'charcoal-rim': '#3f403d',
              'canvas-white': '#ffffff',
              'parchment':    '#e9ebdf',
              'fog-text':     '#cbccc4',
              'ash-text':     '#94958e',
              'forest-deep':  '#185849',
              'midnight-moss':'#0e352c',
              'emerald-brand':'#10b981',
            },
            fontFamily: {
              sans:    ['Inter', 'sans-serif'],
              display: ['Poppins', 'sans-serif'],
              serif:   ['"Playfair Display"', 'serif'],
              mono:    ['"JetBrains Mono"', 'Courier New', 'monospace'],
            },
            borderRadius: {
              'pill': '16777216px',
              'card': '24px',
              'module': '16px',
            },
          },
        },
      }
    </script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter (body), Poppins (display), Playfair Display (serif headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-night-sky text-parchment overflow-x-hidden" style="-ms-overflow-style:none;scrollbar-width:none;overflow-y:scroll;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
